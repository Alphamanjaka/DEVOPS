{% extends 'base.html' %}

{% block content %}
  <div class="card delete-card">
    <div class="delete-icon"><i class="fa-solid fa-trash"></i></div>
    <h2>Supprimer le message ?</h2>
    <p>Vous êtes sur le point de supprimer le message : "<em>{{ object }}</em>"</p>
    <form method="post">
      {% csrf_token %}
      <div class="delete-actions">
        <button type="submit" class="btn btn-danger"><i class="fa-solid fa-trash"></i> Supprimer</button>
        <a href="{% url 'message_list' %}" class="btn btn-primary">Annuler</a>
      </div>
    </form>
  </div>
{% endblock %}
