{% for message in messages_liste %}
  <li class="message-list-item">
    <div>
      <strong><i class="fa-solid fa-user"></i> {{ message.owner.username|default:'Anonyme' }}</strong> : {{ message.contenu|truncatechars:80 }}
    </div>
    <small><i class="fa-regular fa-clock"></i> {{ message.date_envoi|date:'d/m/Y H:i' }}</small>
  </li>
{% empty %}
  <li class="message-list-empty">Aucun message pour le moment.</li>
{% endfor %}
