{% extends 'base.html' %}

{% block title %}Réinitialisation du mot de passe{% endblock %}

{% block content %}
  <div class="login-container">
    <h2><i class="fa-solid fa-key"></i> Mot de passe oublié</h2>
    <form method="post" class="login-form">
      {% csrf_token %}
      {{ form.as_p }}
      <button type="submit" class="btn-primary" style="width:100%;">Envoyer le lien</button>
    </form>
    <p class="form-footer">
      <a href="{% url 'login' %}">Retour à la connexion</a>
    </p>
  </div>
{% endblock %}
