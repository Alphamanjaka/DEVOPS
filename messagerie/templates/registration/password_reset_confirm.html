{% extends 'base.html' %}

{% block title %}Nouveau mot de passe{% endblock %}

{% block content %}
  <div class="login-container">
    <h2><i class="fa-solid fa-lock"></i> Nouveau mot de passe</h2>
    <form method="post" class="login-form">
      {% csrf_token %}
      {{ form.as_p }}
      <button type="submit" class="btn-primary" style="width:100%;">Changer le mot de passe</button>
    </form>
  </div>
{% endblock %}
