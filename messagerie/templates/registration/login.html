{% extends 'base.html' %}

{% block title %}
  Connexion
{% endblock %}

{% block content %}
  <div class="login-container">
    <h2><i class="fa-solid fa-right-to-bracket"></i> Connexion</h2>
    <form method="post" class="login-form">
      {% csrf_token %}
      {{ form.as_p }}
      <button type="submit" class="btn-primary" style="width:100%;">Se connecter</button>
    </form>
    <p class="form-footer">
      <a href="{% url 'password_reset' %}">Mot de passe oublié ?</a>
    </p>
    <p class="form-footer">
      Pas encore de compte ? <a href="{% url 'register' %}">Inscrivez-vous</a>
    </p>
  </div>
{% endblock %}
