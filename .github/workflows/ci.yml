name: CI – Tests & Lint

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

jobs:
  tests:
    name: Tests & Couverture
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Création du fichier .env pour les tests
        run: |
          cat > .env << EOF
          POSTGRES_DB=test_db
          POSTGRES_USER=test_user
          POSTGRES_PASSWORD=test_password
          SECRET_KEY=ci-secret-key-pour-les-tests
          DEBUG=1
          DB_HOST=db
          DB_PORT=5432
          EOF

      - name: Build de l'image Docker
        run: docker compose build web

      - name: Démarrage des services
        run: docker compose up -d db

      - name: Attente que la base soit prête
        run: |
          for i in $(seq 1 30); do
            docker compose exec -T db pg_isready -U test_user -d test_db && break
            echo "Attente de la base... ($i/30)"
            sleep 2
          done

      - name: Exécution des migrations
        run: docker compose run --rm web python manage.py migrate --noinput

      - name: Tests unitaires Django
        run: docker compose run --rm web python manage.py test --noinput

      - name: Rapport de couverture
        run: |
          docker compose run --rm web sh -c "\
            coverage run --source=mymessages manage.py test --noinput && \
            coverage report --fail-under=70 && \
            coverage xml -o coverage.xml"

      - name: Upload du rapport de couverture
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage.xml

  lint:
    name: Lint & Qualité
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Création du fichier .env
        run: |
          cat > .env << EOF
          POSTGRES_DB=test_db
          POSTGRES_USER=test_user
          POSTGRES_PASSWORD=test_password
          SECRET_KEY=ci-secret-key-pour-les-tests
          DEBUG=1
          DB_HOST=db
          DB_PORT=5432
          EOF

      - name: Build et lint
        run: |
          docker compose build web
          docker compose run --rm web sh -c "\
            python -m py_compile manage.py && \
            python -m py_compile messagerie/settings.py && \
            python -m py_compile mymessages/models.py && \
            python -m py_compile mymessages/views.py && \
            python -m py_compile mymessages/forms.py"
