name: CI/CD

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

env:
  IMAGE_NAME: messagerie-devops

jobs:
  tests:
    name: Tests & Couverture
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Création du fichier .env pour les tests
        run: |
          cat > .env << EOF
          POSTGRES_DB=test_db
          POSTGRES_USER=test_user
          POSTGRES_PASSWORD=test_password
          SECRET_KEY=ci-secret-key-pour-les-tests
          DEBUG=1
          DB_HOST=db
          DB_PORT=5432
          EOF

      - name: Build de l'image Docker
        run: docker compose build web

      - name: Démarrage des services
        run: docker compose up -d db

      - name: Attente que la base soit prête
        run: |
          for i in $(seq 1 30); do
            docker compose exec -T db pg_isready -U test_user -d test_db && break
            echo "Attente de la base... ($i/30)"
            sleep 2
          done

      - name: Exécution des migrations
        run: docker compose run --rm web python manage.py migrate --noinput

      - name: Tests unitaires Django
        run: docker compose run --rm web python manage.py test --noinput

      - name: Rapport de couverture
        run: |
          docker compose run --rm web sh -c "\
            coverage run --source=mymessages manage.py test --noinput && \
            coverage report --fail-under=70 && \
            coverage xml -o coverage.xml"

      - name: Upload du rapport de couverture
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage.xml

  lint:
    name: Lint & Qualité
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Création du fichier .env
        run: |
          cat > .env << EOF
          POSTGRES_DB=test_db
          POSTGRES_USER=test_user
          POSTGRES_PASSWORD=test_password
          SECRET_KEY=ci-secret-key-pour-les-tests
          DEBUG=1
          DB_HOST=db
          DB_PORT=5432
          EOF

      - name: Build et lint avec pre-commit
        run: |
          docker compose build web
          docker compose run --rm web sh -c "\
            pip install pre-commit --quiet && \
            pre-commit run --all-files"

  build-and-push:
    name: Build & Push Image Docker
    needs: [tests, lint]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      - name: Connexion au Registry (GHCR)
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin

      - name: Génération des tags
        run: |
          IMAGE_ID=ghcr.io/${{ github.repository }}
          IMAGE_ID=$(echo $IMAGE_ID | tr '[:upper:]' '[:lower:]')
          echo "TAGS=$IMAGE_ID:latest" >> $GITHUB_ENV
          echo "TAG_VERSION=$IMAGE_ID:${{ github.sha }}" >> $GITHUB_ENV

      - name: Build et Push
        run: |
          docker build -t ${{ env.TAGS }} -t ${{ env.TAG_VERSION }} .
          docker push ${{ env.TAGS }}
          docker push ${{ env.TAG_VERSION }}

      - name: Notification webhook
        if: success()
        run: |
          curl -s -X POST http://localhost:8000/api/webhook/github/ \
            -H "Content-Type: application/json" \
            -d '{
              "ref": "refs/heads/${{ github.ref_name }}",
              "commits": [{
                "id": "${{ github.sha }}",
                "message": "CD OK – Image poussée sur GHCR"
              }],
              "sender": {"login": "${{ github.actor }}"},
              "repository": {"full_name": "${{ github.repository }}"}
            }' || echo "Webhook notification skipped (not running locally)"
