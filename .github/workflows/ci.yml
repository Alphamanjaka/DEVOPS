name: Pipeline Messagerie DevOps

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

env:
  IMAGE_NAME: messagerie-devops

jobs:
  tests:
    name: Tests & Couverture
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Création du fichier .env pour les tests
        run: |
          cat > .env << EOF
          POSTGRES_DB=test_db
          POSTGRES_USER=test_user
          POSTGRES_PASSWORD=test_password
          SECRET_KEY=ci-secret-key-pour-les-tests
          DEBUG=1
          DB_HOST=db
          DB_PORT=5432
          EOF

      - name: Build de l'image Docker
        run: docker compose build web

      - name: Démarrage des services
        run: docker compose up -d db

      - name: Exécution des migrations
        run: docker compose run --rm web python manage.py migrate --noinput

      - name: Tests unitaires Django
        run: docker compose run --rm web python manage.py test --noinput

      - name: Rapport de couverture
        run: |
          docker compose run --rm web sh -c "\
            coverage run --source=mymessages manage.py test --noinput && \
            coverage report --fail-under=70 && \
            coverage xml -o coverage.xml"

      - name: Upload du rapport de couverture
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage.xml

  lint:
    name: Lint & Qualité
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Création du fichier .env
        run: |
          cat > .env << EOF
          POSTGRES_DB=test_db
          POSTGRES_USER=test_user
          POSTGRES_PASSWORD=test_password
          SECRET_KEY=ci-secret-key-pour-les-tests
          DEBUG=1
          DB_HOST=db
          DB_PORT=5432
          EOF

      - name: Build et lint
        run: |
          docker compose build web
          docker compose run --rm web sh -c "\
            python -m py_compile manage.py && \
            python -m py_compile messagerie/settings.py && \
            python -m py_compile mymessages/models.py && \
            python -m py_compile mymessages/views.py && \
            python -m py_compile mymessages/forms.py"

  build-and-push:
    name: Build & Push Image Docker
    runs-on: ubuntu-latest
    needs: [tests, lint]
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      - name: Connexion au Registry (GHCR)
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin

      - name: Génération des tags
        run: |
          IMAGE_ID=ghcr.io/${{ github.repository }}
          IMAGE_ID=$(echo $IMAGE_ID | tr '[:upper:]' '[:lower:]')

          # Tag "latest" pour main, sinon tag = nom de branche
          if [ "${{ github.ref_name }}" = "main" ]; then
            echo "TAGS=$IMAGE_ID:latest" >> $GITHUB_ENV
          else
            echo "TAGS=$IMAGE_ID:${{ github.ref_name }}" >> $GITHUB_ENV
          fi

      - name: Build et Push
        run: |
          docker build -t ${{ env.TAGS }} .
          docker push ${{ env.TAGS }}

      - name: Notification webhook
        if: success()
        run: |
          curl -s -X POST http://localhost:8000/api/webhook/github/ \
            -H "Content-Type: application/json" \
            -d '{
              "ref": "refs/heads/${{ github.ref_name }}",
              "commits": [{
                "id": "${{ github.sha }}",
                "message": "Pipeline OK - Image poussée sur GHCR"
              }],
              "sender": {"login": "${{ github.actor }}"},
              "repository": {"full_name": "${{ github.repository }}"}
            }' || echo "Webhook notification skipped (not running locally)"